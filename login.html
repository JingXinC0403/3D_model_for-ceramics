<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARE — Log In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Modak&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="nav.css">
  <link rel="stylesheet" href="font.css">
  <link rel="stylesheet" href="auth.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script defer src="auth.js"></script>
</head>

<body>

<main class="auth-view">
  <div class="auth-card">
    <h1 class="auth-title modak-regular">C.A.R.E.</h1>
    <p class="auth-subtitle">Log in to your artifact projects.</p>

    <form id="login-form">
      <div class="auth-field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" autocomplete="email" required>
      </div>

      <div class="auth-field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="auth-submit-btn" id="login-submit-btn">Log In →</button>
    </form>

    <p class="auth-message" id="login-message"></p>

    <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>
</main>

</body>
</html>
