<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARE — Sign Up</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Modak&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="nav.css">
  <link rel="stylesheet" href="font.css">
  <link rel="stylesheet" href="auth.css">

  <script src="sheets-config.js"></script>
  <script src="auth.js"></script>
</head>

<body>

<main class="auth-view">
  <div class="auth-card">
    <h1 class="auth-title modak-regular">C.A.R.E.</h1>
    <p class="auth-subtitle">Create an account to start your artifact projects.</p>

    <form id="signup-form">
      <div class="auth-field">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" autocomplete="email" required>
      </div>

      <div class="auth-field">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" autocomplete="new-password" minlength="6" required>
      </div>

      <button type="submit" class="auth-submit-btn" id="signup-submit-btn">Sign Up →</button>
    </form>

    <p class="auth-message" id="signup-message"></p>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</main>
<!-- SIGN-UP SUCCESS VIDEO -->
<div id="signup-success-video">
  <video id="success-video" playsinline>
    <source src="signup-success.mp4" type="video/mp4">
  </video>
</div>

<style>
  #signup-success-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: black;
    z-index: 99999;

    display: none;
    align-items: center;
    justify-content: center;
  }

  #signup-success-video.show {
    display: flex;
  }

  #signup-success-video video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>

<script>
  const successVideoOverlay =
    document.getElementById("signup-success-video");

  const successVideo =
    document.getElementById("success-video");

  function playSignupSuccessVideo() {
    successVideoOverlay.classList.add("show");

    successVideo.currentTime = 0;

    successVideo.play().catch(error => {
      console.error("Could not play signup video:", error);

      // If playback fails, continue anyway
      window.location.href = "index.html";
    });
  }

  successVideo.addEventListener("ended", () => {
    window.location.href = "index.html";
  });
</script>
  
</body>
</html>
