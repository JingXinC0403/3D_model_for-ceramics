<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to C.A.R.E.</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .welcome-container {
      width: 90%;
      max-width: 900px;
    }

    h1 {
      color: #1a2376;
      font-size: 40px;
    }

    p {
      color: #555;
      font-size: 18px;
    }

    video {
      width: 100%;
      max-width: 850px;
      border-radius: 15px;
      margin: 25px 0;
    }

    button {
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      background: #6397ff;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="welcome-container">

    <h1>Welcome to C.A.R.E.!</h1>

    <p>Here's a quick introduction to C.A.R.E.</p>

    <video controls playsinline>
      <source src="assets/signup-video.mp4" type="video/mp4">
      Your browser does not support video playback.
    </video>

    <br>

    <button onclick="window.location.href='index.html'">
      Continue to C.A.R.E. →
    </button>

  </div>

</body>
</html>
